# Build the React frontend and publish it to GitHub Pages.
# Used as a reliable, always-on, $0 home for the app while Cloudflare Pages
# resolves its account-level 522 issue. Deep-link refreshes are handled by the
# 404.html SPA fallback; the API/WS point straight at the Render backend.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /PolySignal-Polymarket-Analytics-Platform/
          VITE_BASE_PATH: /PolySignal-Polymarket-Analytics-Platform
          VITE_API_BASE_URL: https://polysignal-api.onrender.com
          VITE_WS_URL: wss://polysignal-api.onrender.com
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4